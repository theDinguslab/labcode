<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CONTACT</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #00ff00;
      color: black;
      font-family: "Comic Sans MS", "Courier New", monospace;
      text-align: center;
    }
    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 4rem;
      text-shadow: 2px 2px 0 black;
    }
    nav a {
      display: inline-block;
      margin: 8px 12px;
      padding: 10px 16px;
      background: black;
      color: #00ff00;
      text-decoration: none;
      border: 3px solid #000;
      font-weight: bold;
    }
    .contact-box {
      border: 6px ridge black;
      background: rgba(255,255,255,0.75);
      padding: 24px;
      margin-top: 20px;
    }
    .contact-box h2 {
      font-size: 4rem;
      margin: 0;
      color: red;
      text-shadow: 2px 2px 0 black;
    }
    .editable {
      margin-top: 20px;
      border: 3px dashed black;
      background: rgba(255,255,255,0.9);
      padding: 14px;
      text-align: left;
    }
    .gif {
      margin: 18px auto;
      width: 260px;
      border: 4px double black;
    }
    .color-switcher {
  position: fixed;
  top: 12px;
  right: 12px;
  background: rgba(0, 0, 0, 0.7);
  color: #00ff00;
  border: 2px solid black;
  border-radius: 8px;
  padding: 8px 10px;
  font-family: "Comic Sans MS", "Courier New", monospace;
  z-index: 999;
  font-size: 0.9rem;
}
.color-switcher select {
  margin-left: 6px;
  background: black;
  color: #00ff00;
  border: 2px solid #00ff00;
  padding: 2px 6px;
}
  </style>
</head>
<body>
  <div class="page">
    <div class="color-switcher">
  <label for="bg-color-select"></label>

</div>

  </div>
  <script>
  const colorSelect = document.getElementById("bg-color-select");

  function applyBgColor(color) {
    document.body.style.background = color;
    localStorage.setItem("siteBgColor", color);
  }

  colorSelect.addEventListener("change", (event) => {
    applyBgColor(event.target.value);
  });

  const savedColor = localStorage.getItem("siteBgColor");
  if (savedColor) {
    colorSelect.value = savedColor;
    applyBgColor(savedColor);
  }
</script>
</body>
</html>
