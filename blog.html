<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BLOG</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #00ff00;
      color: black;
      font-family: "Comic Sans MS", "Courier New", monospace;
      text-align: center;
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 3.6rem;
      text-shadow: 2px 2px 0 black;
    }
    nav a {
      display: inline-block;
      margin: 8px 12px;
      padding: 10px 16px;
      background: black;
      color: #00ff00;
      text-decoration: none;
      border: 3px solid #000;
      font-weight: bold;
    }
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 20px;
      text-align: left;
    }
    .post-card {
      border: 4px dotted black;
      background: rgba(255,255,255,0.85);
      padding: 16px 18px;
    }
    .post-card h2 {
      margin: 0 0 4px;
      font-size: 1.6rem;
      text-shadow: 1px 1px 0 black;
    }
    .post-date {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }
    .post-tags {
      margin-bottom: 10px;
    }
    .post-tags span {
      display: inline-block;
      background: black;
      color: #00ff00;
      font-size: 0.75rem;
      padding: 2px 8px;
      margin-right: 6px;
      border-radius: 4px;
    }
    .post-body p {
      margin: 0 0 10px;
      line-height: 1.4;
    }
    .post-body img {
      max-width: 100%;
      border: 3px solid black;
      margin: 10px 0;
    }
    .empty-note {
      margin-top: 30px;
      font-style: italic;
    }
    .color-switcher {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      border: 2px solid black;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: "Comic Sans MS", "Courier New", monospace;
      z-index: 999;
      font-size: 0.9rem;
    }
    .color-switcher select {
      margin-left: 6px;
      background: black;
      color: #00ff00;
      border: 2px solid #00ff00;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="color-switcher">
      <label for="bg-color-select"></label>
      <select id="bg-color-select">
        <option value="#00ff00">Neon Green</option>
        <option value="#ff55ff">Hot Pink</option>
        <option value="#00ffff">Electric Cyan</option>
        <option value="#ffff00">Blazing Yellow</option>
        <option value="#ff9900">Retro Orange</option>
        <option value="#7f00ff">Ultra Purple</option>
        <option value="#0099ff">Pixel Blue</option>
        <option value="#ffffff">White</option>
        <option value="#000000">Black</option>
        <option value="#444444">Dark Grey</option>
      </select>
    </div>

    <h1>BLOG</h1>

    <nav>
      <a href="index.html">HOME</a>
      <a href="lab-gallery.html">LAB GALLERY</a>
      <a href="blog.html">BLOG</a>
      <a href="contact.html">CONTACT</a>
    </nav>

    <div id="post-list" class="post-list"></div>
    <p id="empty-note" class="empty-note" style="display:none;">No posts yet. Add one in the POSTS array in this file's script.</p>
  </div>

  <script>
    /* new post template
       {
         title: "Post title here",
         date: "Month Day, Year",
         tags: ["tag1", "tag2"],
         body: `
           <p></p>
           <p><b>bold</b><img src="URL" /></p>
         `
       },

        */

    const POSTS = [
    
    ];

    function renderPosts() {
      const list = document.getElementById("post-list");
      const emptyNote = document.getElementById("empty-note");

      if (!POSTS.length) {
        emptyNote.style.display = "block";
        return;
      }

      list.innerHTML = POSTS.map(post => `
        <article class="post-card">
          <h2>${post.title}</h2>
          <span class="post-date">${post.date}</span>
          ${post.tags && post.tags.length ? `
            <div class="post-tags">
              ${post.tags.map(t => `<span>${t}</span>`).join("")}
            </div>` : ""
          }
          <div class="post-body">${post.body}</div>
        </article>
      `).join("");
    }

    renderPosts();

    const colorSelect = document.getElementById("bg-color-select");

    function applyBgColor(color) {
      document.body.style.background = color;
      localStorage.setItem("siteBgColor", color);
    }

    colorSelect.addEventListener("change", (event) => {
      applyBgColor(event.target.value);
    });

    const savedColor = localStorage.getItem("siteBgColor");
    if (savedColor) {
      colorSelect.value = savedColor;
      applyBgColor(savedColor);
    }
  </script>
</body>
</html>
